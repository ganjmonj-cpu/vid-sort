<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>Vid Sort</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f;
      --surface: #181818;
      --surface-hover: #222;
      --text: #f1f1f1;
      --muted: #aaa;
      --border: #303030;
      --accent: #ff0033;
      --accent-soft: rgba(255, 0, 51, 0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 15, 15, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .topbar-inner,
    main {
      width: min(100%, 1440px);
      margin-inline: auto;
    }

    .topbar-inner {
      padding: 18px 24px;
    }

    .brand {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .brand span {
      color: var(--accent);
    }

    main {
      flex: 1;
      padding: 24px;
    }

    .intro {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 16px;
      align-items: start;
      width: min(100%, 1100px);
      margin-bottom: 24px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .search-form input {
      min-width: 0;
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #3f3f3f;
      border-radius: 24px;
      background: #121212;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .search-form input:focus {
      border-color: #777;
    }

    .search-form button {
      padding: 0 20px;
      border: 0;
      border-radius: 20px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .search-form button:hover {
      background: #e6002e;
    }

    .blacklist-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .blacklist-box h3 {
      margin: 0;
      padding: 12px 14px 8px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .blacklist-box textarea {
      width: 100%;
      min-height: 92px;
      padding: 0 14px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      resize: vertical;
      outline: none;
    }

    .status {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid var(--accent-soft);
      border-radius: 10px;
      background: rgba(255, 0, 51, 0.05);
      color: #ffd9e1;
      font-size: 14px;
    }

    .status.visible {
      display: block;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px 18px;
    }

    .video-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      transition: background-color 150ms ease, transform 150ms ease, border-color 150ms ease;
    }

    .video-card:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .source {
      padding: 12px 14px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #242424;
    }

    .card-details {
      padding: 12px 14px 16px;
    }

    .title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }

    .creator {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state {
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.01);
    }

    @media (max-width: 980px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .results {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .topbar-inner,
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      main {
        padding-top: 18px;
      }

      .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">Vid <span>Sort</span></h1>
    </div>
  </header>

  <main>
    <p class="intro">Search across YouTube, Vimeo, and Dailymotion with a personal blacklist.</p>

    <div class="controls">
      <form id="searchForm" class="search-form" role="search">
        <input id="queryInput" type="search" aria-label="Search videos" placeholder="Search videos" value="cats" />
        <button type="submit">Search</button>
      </form>

      <div class="blacklist-box">
        <h3>Blacklist</h3>
        <textarea id="blacklistInput" aria-label="Blacklist words, phrases, or creators" placeholder="Separate words or creators with commas"></textarea>
      </div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script>
    const queryInput = document.getElementById('queryInput');
    const blacklistInput = document.getElementById('blacklistInput');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const searchForm = document.getElementById('searchForm');

    const defaultQuery = 'cats';
    const savedQuery = localStorage.getItem('vidsort-query') || defaultQuery;
    const savedBlacklist = localStorage.getItem('vidsort-blacklist') || '';
    queryInput.value = savedQuery;
    blacklistInput.value = savedBlacklist;

    function setStatus(message, visible = true) {
      statusEl.textContent = message;
      statusEl.classList.toggle('visible', visible);
    }

    function renderCards(items) {
      resultsEl.innerHTML = '';

      if (!items.length) {
        resultsEl.innerHTML = '<div class="empty-state">No results matched your search and blacklist.</div>';
        return;
      }

      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'video-card';

        const source = document.createElement('div');
        source.className = 'source';
        source.textContent = item.source || 'Source';

        const img = document.createElement('img');
        img.className = 'thumbnail';
        img.src = item.thumbnail || 'https://placehold.co/640x360/242424/f1f1f1?text=No+thumbnail';
        img.alt = item.title || 'Video thumbnail';

        const details = document.createElement('div');
        details.className = 'card-details';

        const title = document.createElement('h2');
        title.className = 'title';
        title.textContent = item.title || 'Untitled';

        const creator = document.createElement('p');
        creator.className = 'creator';
        creator.textContent = item.creator || 'Unknown creator';

        const link = document.createElement('a');
        link.href = item.url || '#';
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.style.display = 'block';
        link.style.textDecoration = 'none';
        link.style.color = 'inherit';
        link.appendChild(img);

        details.appendChild(title);
        details.appendChild(creator);

        card.appendChild(source);
        card.appendChild(link);
        card.appendChild(details);
        resultsEl.appendChild(card);
      }
    }

    async function fetchResults() {
      const query = queryInput.value.trim();
      const blacklist = blacklistInput.value.trim();

      if (!query) {
        renderCards([]);
        setStatus('Enter a search term first.', true);
        return;
      }

      localStorage.setItem('vidsort-query', query);
      localStorage.setItem('vidsort-blacklist', blacklist);

      setStatus('Loading results…', true);

      try {
        const encodedQuery = encodeURIComponent(query);
        const encodedBlacklist = encodeURIComponent(blacklist);
        const response = await fetch(`/api/search?q=${encodedQuery}&blacklist=${encodedBlacklist}`);

        if (!response.ok) {
          throw new Error('Request failed');
        }

        const data = await response.json();
        renderCards(data.results || []);

        if ((data.results || []).length === 0) {
          setStatus('No results matched your current search and blacklist.', true);
        } else {
          setStatus(`Showing ${data.results.length} result${data.results.length === 1 ? '' : 's'}.`, true);
        }
      } catch (error) {
        renderCards([]);
        setStatus('Unable to load results right now. Please try again.', true);
      }
    }

    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      fetchResults();
    });

    blacklistInput.addEventListener('change', fetchResults);

    fetchResults();
  </script>
</body>
</html>
